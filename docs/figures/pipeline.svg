<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" width="960" height="382" role="img" aria-label="How one episode is scored. The agent works alone. A hidden test decides the result after the attempt ends."><title>How one episode is scored. The agent works alone. A hidden test decides the result after the attempt ends.</title><style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0b0b0b;font-size:14px}
.bg{fill:#fcfcfb}.edge{fill:none;stroke:#0b0b0b;stroke-opacity:.1}
.card{fill:#f9f9f7;stroke:#c3c2b7}
.title{font-size:22px;font-weight:600}.hero{font-size:36px;font-weight:600}.big{font-size:30px;font-weight:600}
.strong{font-weight:600}.sub,.sub tspan{fill:#52514e}.mute{fill:#898781;font-size:12px}.foot{fill:#52514e;font-size:12px}
.tick{fill:#898781;font-size:12px;font-variant-numeric:tabular-nums}.num{font-variant-numeric:tabular-nums}
.inv{fill:#fff;font-size:12px;font-weight:600}
.blue{fill:#2a78d6}.orange{fill:#eb6834}.gray{fill:#898781}.empty{fill:#f0efec}.band{fill:#2a78d6;fill-opacity:.1}
.ring{stroke:#fcfcfb;stroke-width:2}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.link{stroke:#898781;stroke-width:2;stroke-linecap:round}
.arrow{stroke:#52514e;stroke-width:1.5;fill:none}.head{fill:#52514e}.check{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){
text{fill:#f0efec}
.bg{fill:#1a1a19}.edge{stroke:#fff}
.card{fill:#0d0d0d;stroke:#383835}
.sub,.sub tspan,.foot{fill:#c3c2b7}
.blue{fill:#3987e5}.orange{fill:#d95926}.empty{fill:#383835}.band{fill:#3987e5}
.ring{stroke:#1a1a19}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}
.arrow{stroke:#c3c2b7}.head{fill:#c3c2b7}
.inv{fill:#fff}.mute,.tick{fill:#898781}
}
</style><rect class="bg" width="960" height="382" rx="14"/><rect class="edge" x=".5" y=".5" width="959" height="381" rx="14"/><text x="32.0" y="44.0" class="title">How one episode is scored</text><text x="32.0" y="70.0" class="sub">The agent works alone. A hidden test decides the result after the attempt ends.</text><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" class="head"/></marker></defs><rect x="32" y="104" width="150" height="92" rx="10" class="card"/><text x="107.0" y="135.0" class="strong" text-anchor="middle">Task</text><text x="107.0" y="155.0" class="sub" text-anchor="middle">Real repository</text><text x="107.0" y="175.0" class="sub" text-anchor="middle">with a seeded bug</text><rect x="216" y="104" width="170" height="92" rx="10" class="card"/><text x="301.0" y="135.0" class="strong" text-anchor="middle">OpenCode agent</text><text x="301.0" y="155.0" class="sub" text-anchor="middle">Reads, edits, runs</text><text x="301.0" y="175.0" class="sub" text-anchor="middle">in a bubblewrap sandbox</text><rect x="430" y="104" width="150" height="92" rx="10" class="card"/><text x="505.0" y="135.0" class="strong" text-anchor="middle">Visible test</text><text x="505.0" y="155.0" class="sub" text-anchor="middle">The agent can</text><text x="505.0" y="175.0" class="sub" text-anchor="middle">read this one</text><rect x="624" y="104" width="150" height="92" rx="10" class="card"/><text x="699.0" y="135.0" class="strong" text-anchor="middle">Private oracle</text><text x="699.0" y="155.0" class="sub" text-anchor="middle">Never mounted,</text><text x="699.0" y="175.0" class="sub" text-anchor="middle">never in a prompt</text><rect x="808" y="104" width="120" height="92" rx="10" class="card"/><text x="868.0" y="145.0" class="strong" text-anchor="middle">Score</text><text x="868.0" y="165.0" class="sub" text-anchor="middle">Pass or fail</text><rect x="136" y="244" width="196" height="92" rx="10" class="card"/><text x="234.0" y="275.0" class="strong" text-anchor="middle">llama-server</text><text x="234.0" y="295.0" class="sub" text-anchor="middle">Qwen3.5-4B on the GPU</text><text x="234.0" y="315.0" class="sub" text-anchor="middle">outside the sandbox</text><rect x="430" y="244" width="190" height="92" rx="10" class="card"/><text x="525.0" y="275.0" class="strong" text-anchor="middle">One retry</text><text x="525.0" y="295.0" class="sub" text-anchor="middle">Same task, thinking on,</text><text x="525.0" y="315.0" class="sub" text-anchor="middle">temperature 0.6</text><polyline points="182.0,150.0 214.0,150.0" class="arrow" marker-end="url(#tip)"/><polyline points="386.0,150.0 428.0,150.0" class="arrow" marker-end="url(#tip)"/><polyline points="580.0,150.0 622.0,150.0" class="arrow" marker-end="url(#tip)"/><polyline points="774.0,150.0 806.0,150.0" class="arrow" marker-end="url(#tip)"/><polyline points="262.0,196.0 262.0,242.0" class="arrow" marker-end="url(#tip)" marker-start="url(#tip)"/><polyline points="505.0,196.0 505.0,242.0" class="arrow" marker-end="url(#tip)"/><polyline points="430.0,290.0 360.0,290.0 360.0,198.0" class="arrow" marker-end="url(#tip)"/><text x="601.0" y="140.0" class="mute" text-anchor="middle">passes</text><text x="513.0" y="224.0" class="mute">fails</text><text x="272.0" y="224.0" class="mute">local API</text></svg>
