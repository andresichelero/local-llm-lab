<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="One retry with thinking is the only confirmed gain. Pass rate of 36 paired episodes. The axis starts at 40%."><title>One retry with thinking is the only confirmed gain. Pass rate of 36 paired episodes. The axis starts at 40%.</title><style>
