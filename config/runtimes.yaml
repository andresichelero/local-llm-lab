schema_version: 1
runtimes:
  llama_cpp:
    upstream: https://github.com/ggml-org/llama.cpp
    status: candidate
    rationale: Broad GGUF support, explicit CUDA offload, KV cache formats, CPU/GPU hybrid execution.
    install: official source build with CUDA if the WSL toolkit can be added within the disk budget; otherwise use a verified upstream Windows CUDA release and mark the host difference.
  exllamav3:
    upstream: https://github.com/turboderp-org/exllamav3
    status: installed_on_ssd_inference_smoke_passed
    version: 1.6.1+cu128.torch2.10.0
    torch: 2.10.0+cu128
    python: 3.12
    storage_root: ${BENCH_STORAGE_ROOT}/envs/exllamav3
    rationale: EXL3, quantized cache, speculative decoding and CPU offload; official CPython 3.12 CUDA 12.8/PyTorch 2.10 Linux wheel is pinned by the GitHub release API digest and passed SSD inference at 2K, 8K and 16K.
  transformers_torch:
    upstream: https://github.com/huggingface/transformers
    status: candidate_install_pinned
    rationale: Reference path for model support, QLoRA and quality checks; large dependencies under current WSL memory/disk constraints.
  bitsandbytes:
    upstream: https://github.com/bitsandbytes-foundation/bitsandbytes
    status: candidate_install_pinned
    version: 0.50.2
    rationale: Official Linux CUDA 12.8 wheels include sm86; isolate from ExLlama and run a real 4-bit training smoke.
  peft:
    upstream: https://github.com/huggingface/peft
    status: candidate_install_pinned
    version: 0.21.2
    rationale: Current release supports recent Transformers 5.x and LoRA/QLoRA adapter training.
  trl:
    upstream: https://github.com/huggingface/trl
    status: candidate_install_pinned
    version: 1.14.1
    rationale: Optional SFT training interface; first baseline uses a small deterministic local dataset.
  unsloth:
    upstream: https://github.com/unslothai/unsloth
    status: installed_ssd_smoke_passed
    version: 2026.10.3
    python: 3.12
    torch: 2.10.0+cu128
    transformers: 5.17.0
    trl: 1.13.0
    peft: 0.21.2
    bitsandbytes: 0.50.2
    xformers: 0.0.34
    storage_root: ${BENCH_STORAGE_ROOT}/envs/unsloth
    rationale: Isolated C:-SSD WSL env passed one warm-up and three RTX 3070 QLoRA training smokes. Lower allocated VRAM than PEFT baseline, but this short run was not faster; lora_dropout=0.05 disables fused LoRA kernels.

